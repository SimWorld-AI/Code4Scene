# Code4Scene third-party content packs (public set only).
#
# Each entry is one Unreal Engine content folder that the public tasks load
# from /Game/<folder>. Tasks and ground-truth scenes use these paths as-is, so
# the pack has to be installed at Content/<folder> in your UE 5.8 project.
#
# The packs are NOT included in this repository. Get each one from its Fab
# listing under that listing's license. See docs/PACKS.md for install steps.
#
# used_by lists the public case ids (benchmark/public-*-cases.txt) that need
# the pack. demo_maps_used lists the seller levels that image-to-scene
# ground-truth scenes were built from; text-to-scene tasks start from an empty
# stage and only use the pack's assets.
schema: code4scene.packs.v1
checked_at: '2026-09-26'
price_basis: >-
  Personal-tier list price in USD shown on the Fab listing on the check date (before temporary discounts
  and taxes). Prices and license terms can change; the listing page is authoritative.
match_confidence_levels:
  exact_uid_confirmed: >-
    Live listing checked; its build or its published mesh/material/texture counts match the benchmark
    reference copy.
  title_seller: >-
    Live listing checked; title and seller match and the content is consistent, but no exact fingerprint
    was available.
  title_only: Only the title matches.
  unresolved: No Fab listing could be identified.
