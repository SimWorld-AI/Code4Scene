# Code4Scene public task. The level to start from is an empty map the dataset
# builder creates; the listed packs must be installed from Fab.
id: case_123
kind: scene_generation
inputs:
  prompt: "Create an open science-fiction power installation scene under cool daylight, with weathered\
    \ metallic ground and restrained glowing accents. A tall central tower stands in front of two smaller\
    \ towers. Low mounds line the rear and sides, leaving the front open. Keep a broad approach from the\
    \ front to the central tower. Group generators to its right, with curved pipes running to its base\
    \ and extra pipes beside the generators. Put power-line units behind the generators and cords near\
    \ their bases. Place a metal statue to the left of the approach, apart from the machinery.\n\n===\
    \ ASSET PALETTE ===\nBuild this scene using ONLY the assets below — asset search is not available\n\
    in this run, so this list is your entire library. Format:\n\n  id | name | category | width x depth\
    \ x height (m) | spawn path\n\nThe id is what a scene graph refers to; the spawn path is what reaches\
    \ UE.\nYou decide which to use, how many of each, and where they go — reuse entries\nfreely.\n\n-\
    \ cords | Cords | power_and_details | 0.939x0.999x0.37 m | /Game/Offworld/Meshes/DecorationProps/SM_Cords.SM_Cords\n\
    - generator | Generator | power_and_details | 2.257x3.56x2.26 m | /Game/Offworld/Meshes/DecorationProps/SM_Generator.SM_Generator\n\
    - powerline | Power Line | power_and_details | 17.056x8.242x34.183 m | /Game/Offworld/Meshes/DecorationProps/SM_PowerLine.SM_PowerLine\n\
    - ground_mound | Ground Mound | terrain | 1.045x1.032x0.239 m | /Game/Offworld/Meshes/Ground/SM_Ground_Mound.SM_Ground_Mound\n\
    - ground_mound_2 | Ground Mound 2 | terrain | 1.048x1.031x0.256 m | /Game/Offworld/Meshes/Ground/SM_Ground_Mound_2.SM_Ground_Mound_2\n\
    - ground_mound_3 | Ground Mound 3 | terrain | 1.025x1.005x0.066 m | /Game/Offworld/Meshes/Ground/SM_Ground_Mound_3.SM_Ground_Mound_3\n\
    - ground_plane | Ground Plane | terrain | 1.0x1.0x0.0 m | /Game/Offworld/Meshes/Ground/SM_Ground_Plane.SM_Ground_Plane\n\
    - metalstatue | Metal Statue | landmarks | 1.47x1.145x3.319 m | /Game/Offworld/Meshes/MetalStatue/SM_MetalStatue.SM_MetalStatue\n\
    - pipesbaked_a | Pipes Baked A | pipes | 124.885x33.907x7.702 m | /Game/Offworld/Meshes/Pipes/Baked/SM_PipesBaked_A.SM_PipesBaked_A\n\
    - pipesbaked_b | Pipes Baked B | pipes | 67.112x53.986x17.536 m | /Game/Offworld/Meshes/Pipes/Baked/SM_PipesBaked_B.SM_PipesBaked_B\n\
    - pipesbaked_c | Pipes Baked C | pipes | 9.375x73.206x13.978 m | /Game/Offworld/Meshes/Pipes/Baked/SM_PipesBaked_C.SM_PipesBaked_C\n\
    - pipesbaked_e | Pipes Baked E | pipes | 280.253x65.474x7.179 m | /Game/Offworld/Meshes/Pipes/Baked/SM_PipesBaked_E.SM_PipesBaked_E\n\
    - pipemed_spline_nonnanite | Pipe Med Spline Non Nanite | pipes | 33.195x5.531x5.709 m | /Game/Offworld/Meshes/Pipes/SM_PipeMed_Spline_NonNanite.SM_PipeMed_Spline_NonNanite\n\
    - pipepattern1 | Pipe Pattern1 | pipes | 9.731x10.018x2.287 m | /Game/Offworld/Meshes/Pipes/SM_PipePattern1.SM_PipePattern1\n\
    - piperounded | Pipe Rounded | pipes | 6.812x14.058x5.129 m | /Game/Offworld/Meshes/Pipes/SM_PipeRounded.SM_PipeRounded\n\
    - pipesmall_spline_nonnanite | Pipe Small Spline Non Nanite | pipes | 15.393x2.802x2.82 m | /Game/Offworld/Meshes/Pipes/SM_PipeSmall_Spline_NonNanite.SM_PipeSmall_Spline_NonNanite\n\
    - scifitower | Sci Fi Tower | landmarks | 40.306x46.542x76.14 m | /Game/Offworld/Meshes/TowerStatic/SM_SciFiTower.SM_SciFiTower\n\
    - tower_piece | Tower Piece | landmarks | 4.972x4.972x29.07 m | /Game/Offworld/Meshes/TowerStatic/SM_Tower_Piece.SM_Tower_Piece\n\
    \n=== THE TASK ===\nRebuild the place described above on the 130 m x 130 m plate, at the density\n\
    and arrangement the description calls for. Budget is 800 tool calls and 180\nminutes — you are not\
    \ expected to use all of it, but clean collision and\nfloating numbers are not on their own evidence\
    \ that the scene is finished.\nTake screenshots, look at them, and judge the result against the description.\n"
  init_map: /Game/SceneBench/BlankStage
  size_m: 130
  budget:
    tool_calls: 800
    wall_minutes: 180
  skills: contracts
assets:
  packs:
  - Offworld
  note: the content this task is built out of; provisioning mounts exactly these and fails if it cannot
verifiers:
- name: semantic_requirements
  semantic_retrieval:
    mode: llm
    top_k: 5
  verification_bundle: requirements/case_123.bundle.json
- name: overview_prompt_alignment
