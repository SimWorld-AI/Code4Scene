    \ square supports, low railings, and a broad shadowed opening into a dark columned interior. Keep\
    \ the other three elevations mostly solid, with relief panels, hieroglyphic bands, and colored friezes.\
    \ In front and slightly to one side, place a detached ruined colonnade of four tall painted columns\
    \ beneath two incomplete offset lintel beams. Scatter cracked paving and fragments partly buried in\
    \ sand.\n\n    === GROUND ===\n    Build the FLOOR FIRST, before placing anything else. Call the benchmark\n\
    \    tool `ground_pass` as your first build action: it carpets the whole 200 m\n    plate deterministically\
    \ from a tile chosen for this scene. If you skip it,\n    and do not tile a floor yourself, the scene\
    \ renders as objects floating\n    over empty space -- which is a failed reconstruction no matter\
    \ how good\n    the massing is. These palette entries are also flat surfaces you can tile\n    by\
    \ hand if you prefer:\n\n      - SM_Temple_Floor | 10.0x10.0x0.50 m | /Game/EgyptianTemple/Meshes/SM_Temple_Floor.SM_Temple_Floor\n\
