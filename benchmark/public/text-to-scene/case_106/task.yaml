    \ tiled roofs, dormers, and chimneys. Run a main waterfront street along a stone quay and connect\
    \ smaller streets across canals with short arched bridges, including one opening onto a broad promenade\
    \ with rounded landings. Edge the reflective water with stepped stone, timber retaining walls, and\
    \ iron railings. Add regular trees, ornate lamps, bollards, benches, signs, crossings, puddles, and\
    \ sparse weeds.\n\n    === GROUND ===\n    Build the FLOOR FIRST, before placing anything else. Call\
