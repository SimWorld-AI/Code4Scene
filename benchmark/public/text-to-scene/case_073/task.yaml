    \ a vast, brooding Gothic cathedral complex, weathered brown-gray masonry and dark slate roofs cut\
    \ by deep unlit window openings and strong angular shadows.\n\nOne enormous central structure crowds\
    \ the heart of the scene: connected cathedral halls, steep gabled roofs, massive rectangular blocks,\
    \ flying buttresses, arcaded façades, and a dense forest of tall needle-like spires and open belfry\
    \ towers. Around its perimeter, several smaller but still monumental chapel, gatehouse, and tower\
    \ clusters stand across deep rocky chasms. Long elevated stone bridges and narrow causeways tie them\
    \ back to the core. Wings and bridges radiate outward in an asymmetrical, organic footprint rather\
    \ than following a clean grid. The central architecture is extremely dense; broad gaps of empty, mist-covered\
    \ terrain separate the outer structures.\n\nBeneath the walkways lie rough stepped cliffs, oversized\
    \ boulders, narrow gullies, and dark uneven ground. Scattered pale rocks mark a broken outer edge\
    \ before it dissolves into fog. At street level, elevated pedestrian terraces meet carved stone balustrades,\
    \ rows of pointed arches, and repeated recessed wall panels. Tall supporting piers flare into buttress-like\
    \ feet over the ravine.\n\nOnly sparse secondary details remain: small finials along parapets, decorative\
