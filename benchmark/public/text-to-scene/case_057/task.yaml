  prompt: "Set an isolated Egyptian temple ruin within a vast, softly rolling orange desert. Make one\
    \ compact rectangular temple the dominant structure, with a flat, nearly complete slab roof bounded\
    \ by uneven pale stone coping. Keep the three elevations other than the entrance mostly solid and\
    \ monumental, repeating rectangular relief panels and horizontal ornamental courses across them.\n\
    \nFace its decorated entrance onto an open forecourt. Use a broad, shadowed central opening, several\
    \ closely spaced papyrus-style columns with colorful flared capitals, shorter square supports, and\
    \ low painted railings; through these, reveal a dark columned interior and a faintly illuminated passage\
    \ beyond. Build the massive walls from pale sandstone, slightly battered and divided by shallow projecting\
    \ sections. Detail them with engraved panels, faded figures and hieroglyphic bands, thin gold accents,\
    \ and painted friezes in turquoise, yellow, red, and blue.\n\nIn front of the temple and slightly\
    \ off to one side, place a detached colonnade's remains. Set four tall, slender painted columns in\
    \ a loose line beneath two offset, incomplete sandstone lintel beams, maintaining obvious gaps and\
    \ broken continuity. Around the column bases, scatter small fragments and cracked paving slabs into\
    \ an irregular trail, partly buried in sand.\n\n    === GROUND ===\n    Build the FLOOR FIRST, before\
    \ placing anything else. Call the benchmark\n    tool `ground_pass` as your first build action: it\
    \ carpets the whole 200 m\n    plate deterministically from a tile chosen for this scene. If you skip\
    \ it,\n    and do not tile a floor yourself, the scene renders as objects floating\n    over empty\
